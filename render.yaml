services:
  - type: web
    name: landflow-command-center
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landflow-db
          property: connectionString
      - key: FRONTEND_DIST
        value: /app/dist
      - key: SIH_DEV_AUTH_SECRET
        generateValue: true
      - key: RUST_LOG
        value: info

databases:
  - name: landflow-db
    plan: free
    region: oregon
    version: 16
    databaseName: landflow
    user: landflow
